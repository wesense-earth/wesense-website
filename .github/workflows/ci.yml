name: CI

# The site is built and deployed to Hostinger by deploy-hostinger.yml. This runs the same
# install, lint and build on pull requests, so a change that would break the deploy (including
# Dependabot updates) is caught before it reaches main. "build" is the required check on main.
# Details: https://docs.wesense.earth/developers/dependency-updates

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run lint

      - run: npm run build
